<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>METRO ROYALE X 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#151c19;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:9px;left:9px;padding:10px;background:#101c1bdc;border:1px solid #5ad5a1;border-radius:10px;font-size:13px;line-height:1.7;pointer-events:none}
#message{position:fixed;top:15%;left:50%;transform:translateX(-50%);background:#101cdd;padding:10px;border-radius:9px;color:#6fffc1}
#controls{position:fixed;bottom:16px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px}
button{background:#172d29dd;color:white;border:1px solid #65d9ae;border-radius:12px;font-size:17px;touch-action:none}
.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.pad button:nth-child(5){grid-column:2;grid-row:3}
.actions{display:flex;flex-direction:column;gap:9px}.actions button{width:85px;height:52px;font-size:13px}
#fire{background:#842e2e}#loot{background:#176b43}
#hint{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px;color:#fff;text-shadow:0 0 5px #000;pointer-events:none}
.actions button{height:48px}
#run{background:#52652d}#jump{background:#345c86}
.pad button{background:#172d29bb;backdrop-filter:blur(5px)}
#hud{backdrop-filter:blur(8px);box-shadow:0 3px 16px #0008}
</style>
</head>
<body>
<div id="hud">METRO ROYALE X 3D<br>HP: <span id="hp">100</span><br>Лут: <span id="cash">0</span><br>Боты: <span id="bots">0</span><br>Режим: 3D</div>
<div id="message">ЗАГРУЗКА 3D МИРА...</div>
<div id="crosshair">+</div>
<div id="controls">
<div class="pad" id="pad">
<button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button>
</div>
<div class="actions">
<button id="run">БЕГ</button>
<button id="jump">ПРЫЖОК</button>
<button id="loot">ЛУТ</button>
<button id="fire">ИМПУЛЬС</button>
</div>
</div>
<div id="hint">Кнопки — движение • Проведи пальцем по правой части экрана — поворот камеры</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x899b91);
scene.fog=new THREE.Fog(0x899b91,45,150);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x455448,2));
const sun=new THREE.DirectionalLight(0xffe6c4,2.2);
sun.position.set(-35,55,30);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-90;sun.shadow.camera.right=90;
sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;
scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.92});
function cube(x,y,z,w,h,d,c){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
// Реальный объёмный ландшафт с холмами
const geo=new THREE.PlaneGeometry(190,190,65,65);
const pos=geo.attributes.position;
for(let i=0;i<pos.count;i++){
 const x=pos.getX(i),y=pos.getY(i);
 pos.setZ(i,Math.sin(x*.09)*.7+Math.cos(y*.07)*.8+Math.sin((x+y)*.045)*.5);
}
geo.computeVertexNormals();
const terrain=new THREE.Mesh(geo,material(0x65765c));
terrain.rotation.x=-Math.PI/2;terrain.receiveShadow=true;scene.add(terrain);
// Дороги
cube(0,.08,0,13,.12,190,0x343b39);
cube(0,.09,0,190,.12,13,0x343b39);
for(let i=-80;i<=80;i+=8){
 cube(i,.16,0,.12,.03,2,0xb4a77d);
 cube(0,.16,i,2,.03,.12,0xb4a77d);
}
// Детализированные здания
for(let i=0;i<27;i++){
 let x=(Math.random()-.5)*145,z=(Math.random()-.5)*145;
 if(Math.abs(x)<16||Math.abs(z)<16)continue;
 let w=7+Math.random()*8,d=7+Math.random()*8,h=5+Math.random()*8;
 let colors=[0x77776d,0x666d67,0x555c58,0x837b6b];
 cube(x,h/2,z,w,h,d,colors[i%4]);
 cube(x,h+.08,z,w+.25,.18,d+.25,0x363c39);
 // Окна
 for(let side=-1;side<=1;side+=2){
  for(let j=-1;j<=1;j++){
   let win=cube(x+j*w*.27,h*.65,z+side*(d/2+.02),1.1,1,.08,0x273d40);
  }
 }
 // Дверь
 cube(x,.9,z+d/2+.04,1.4,1.8,.1,0x47372a);
}
// Деревья
for(let i=0;i<55;i++){
 let x=(Math.random()-.5)*165,z=(Math.random()-.5)*165;
 if(Math.abs(x)<12||Math.abs(z)<12)continue;
 cube(x,1.2,z,.55,2.4,.55,0x493b2b);
 const crown=new THREE.Mesh(new THREE.ConeGeometry(2.1,5,7),material(0x315b3b));
 crown.position.set(x,4,z);crown.castShadow=true;scene.add(crown);
}
// Контейнеры
for(let i=0;i<13;i++){
 let x=(Math.random()-.5)*120,z=(Math.random()-.5)*120;
 if(Math.abs(x)<15&&Math.abs(z)<15)continue;
 let c=cube(x,1,z,6,2,2,i%2?0x536d65:0x76563b);
 for(let j=-2;j<=2;j++)cube(x+j*1.1,1.1,z+1.02,.06,1.8,.05,0x263d38);
}
// Игровой персонаж: тело, голова, рюкзак, ноги
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.85,5,10),material(0x344c42));
body.position.y=1.35;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),material(0xd2ae8b));
head.position.y=2.15;player.add(head);
const backpack=new THREE.Mesh(new THREE.BoxGeometry(.65,.85,.35),material(0x514c37));
backpack.position.set(0,1.35,-.55);player.add(backpack);
const leg1=cube(0,0,0,.01,.01,.01,0xffffff);scene.remove(leg1);
player.position.set(0,0,0);scene.add(player);
// Камера и управление
let yaw=0,keys={},cash=0,hp=100,shots=[],loot=[],bots=[],running=false,jumping=false,jumpTime=0;
document.querySelectorAll('[data-k]').forEach(b=>{
 const k=b.dataset.k;
 b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let dragging=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.42){dragging=true;lastX=e.clientX}});
renderer.domElement.addEventListener('pointermove',e=>{if(dragging){yaw-=(e.clientX-lastX)*.008;lastX=e.clientX}});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
document.getElementById('run').onpointerdown=()=>running=true;
document.getElementById('run').onpointerup=()=>running=false;
document.getElementById('run').onpointerleave=()=>running=false;
document.getElementById('jump').onclick=()=>{if(!jumping){jumping=true;jumpTime=0}};
// Лут
for(let i=0;i<22;i++){
 let x=(Math.random()-.5)*125,z=(Math.random()-.5)*125;
 let g=new THREE.Group();
 const base=new THREE.Mesh(new THREE.BoxGeometry(1.5,1,1.2),material(0x795333));
 base.position.y=.5;g.add(base);
 const lid=new THREE.Mesh(new THREE.BoxGeometry(1.55,.18,1.25),material(0xc49b50));
 lid.position.y=1.1;g.add(lid);
 g.position.set(x,0,z);scene.add(g);loot.push(g);
}
// Боты — игровые персонажи
function makeBot(x,z){
 let b=new THREE.Group();
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.8,5,8),material(0x765149));
 torso.position.y=1.2;b.add(torso);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.3,12,10),material(0xc49a78));
 h.position.y=2;b.add(h);
 b.position.set(x,0,z);scene.add(b);return b;
}
for(let i=0;i<8;i++)bots.push(makeBot((Math.random()-.5)*90,(Math.random()-.5)*90));
// Эвакуация
const exit=new THREE.Group();
const ring=new THREE.Mesh(new THREE.TorusGeometry(4,.2,12,40),new THREE.MeshBasicMaterial({color:0x35ff9d}));
ring.rotation.x=Math.PI/2;ring.position.y=.2;exit.add(ring);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(3,3,8,32,1,true),new THREE.MeshBasicMaterial({color:0x35ff9d,transparent:true,opacity:.13,side:THREE.DoubleSide}));
beam.position.y=4;exit.add(beam);exit.position.set(70,0,70);scene.add(exit);
function say(t){const el=document.getElementById('message');el.textContent=t;el.style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>el.style.display='none',1800)}
document.getElementById('loot').onclick=()=>{
 let best=-1,bd=5;
 loot.forEach((l,i)=>{let d=l.position.distanceTo(player.position);if(d<bd){bd=d;best=i}});
 if(best<0)return say('ПОДОЙДИ К КОНТЕЙНЕРУ');
 scene.remove(loot[best]);loot.splice(best,1);cash+=100;
 document.getElementById('cash').textContent=cash;say('ЛУТ +100');
};
// Видимый светящийся импульс
document.getElementById('fire').onclick=()=>{
 const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
 const orb=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),new THREE.MeshBasicMaterial({color:0x32edff}));
 const glow=new THREE.PointLight(0x32edff,2,4);orb.add(glow);
 orb.position.copy(player.position).add(new THREE.Vector3(0,1.5,0)).addScaledVector(dir,1.3);
 scene.add(orb);shots.push({mesh:orb,dir,life:2});
};
let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 let f=(keys.w?1:0)-(keys.s?1:0),s=(keys.d?1:0)-(keys.a?1:0);
 const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
 const right=new THREE.Vector3(forward.z,0,-forward.x);
 const speed=(window.metroSprinting || running)?16:8;
 const mx=(window.joyX||0), my=(window.joyY||0);
 const moveF=f!==0?f:-my, moveS=s!==0?s:mx;
 player.position.addScaledVector(forward,moveF*speed*dt);
 player.position.addScaledVector(right,moveS*speed*dt);
 player.position.x=THREE.MathUtils.clamp(player.position.x,-88,88);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-88,88);
 player.rotation.y=yaw;
 const target=new THREE.Vector3(player.position.x-Math.sin(yaw)*8,5,player.position.z-Math.cos(yaw)*8);
 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(player.position.x,1.3,player.position.z);
 bots.forEach(b=>{
  const dx=player.position.x-b.position.x,dz=player.position.z-b.position.z,d=Math.hypot(dx,dz);
  if(d>3){b.position.x+=dx/d*1.2*dt;b.position.z+=dz/d*1.2*dt}
  b.lookAt(player.position.x,0,player.position.z);
 });
 shots.forEach(s=>{
  s.mesh.position.addScaledVector(s.dir,25*dt);s.life-=dt;
  bots.forEach(b=>{
   if(s.life>0&&s.mesh.position.distanceTo(new THREE.Vector3(b.position.x,b.position.y+1,b.position.z))<1.3){
    scene.remove(b);bots=bots.filter(x=>x!==b);s.life=0;cash+=50;
    document.getElementById('cash').textContent=cash;say('БОТ УДАЛЁН +50');
   }
  });
 });
 shots=shots.filter(s=>{if(s.life<=0){scene.remove(s.mesh);return false}return true});
 document.getElementById('bots').textContent=bots.length;
 if(player.position.distanceTo(exit.position)<5)say('ЭВАКУАЦИЯ ДОСТУПНА!');
 document.getElementById('hp').textContent=hp;
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
say('3D МИР ЗАГРУЖЕН');requestAnimationFrame(animate);
</script>

<div id="joystick"><div id="stick"></div></div>
<style>
#joystick{position:fixed;left:25px;bottom:35px;width:130px;height:130px;border:3px solid #ffffff88;border-radius:50%;background:#1118;z-index:20;touch-action:none}
#stick{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#b8a0ff;border:2px solid white;box-shadow:0 0 15px #8b5cff}
</style>
<script>
(()=>{
const pad=document.getElementById('joystick'),knob=document.getElementById('stick');
let active=false,cx=0,cy=0;
window.joyX=0;window.joyY=0;
function move(e){
 const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const max=42,len=Math.hypot(dx,dy),k=len>max?max/len:1;
 const x=dx*k,y=dy*k;
 knob.style.left=(40+x)+'px';knob.style.top=(40+y)+'px';
 window.joyX=x/max;window.joyY=y/max;
}
pad.addEventListener('pointerdown',e=>{active=true;pad.setPointerCapture(e.pointerId);move(e)});
pad.addEventListener('pointermove',e=>{if(active)move(e)});
function stop(){active=false;window.joyX=0;window.joyY=0;knob.style.left='40px';knob.style.top='40px'}
pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);
})();
</script>

<style>
#sprintFix{
 position:fixed;right:25px;bottom:105px;z-index:999999;
 width:90px;height:90px;border-radius:50%;
 border:3px solid white;background:#a52b2bdd;color:white;
 font-weight:900;font-size:15px;
 box-shadow:0 0 18px #ff4444;
 touch-action:none;user-select:none;
 display:flex;align-items:center;justify-content:center;
}
#sprintFix.active{background:#21a34a;transform:scale(1.08)}
</style>
<div id="sprintFix">СПРИНТ</div>
<script>
(()=>{
 const b=document.getElementById('sprintFix');
 if(!b)return;
 const start=e=>{
  e.preventDefault();
  window.metroSprinting=true;
  b.classList.add('active');
  try{b.setPointerCapture(e.pointerId)}catch(_){}
 };
 const stop=()=>{
  window.metroSprinting=false;
  b.classList.remove('active');
 };
 b.addEventListener('pointerdown',start);
 b.addEventListener('pointerup',stop);
 b.addEventListener('pointercancel',stop);
 b.addEventListener('lostpointercapture',stop);
 window.addEventListener('blur',stop);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
})();
</script>
</body>
</html>
