<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>METRO ROYALE X 3.0</title>
<style>
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101712;color:white;font-family:Arial;display:flex;flex-direction:column}
#top{height:42px;flex-shrink:0;background:#17251b;display:flex;justify-content:space-around;align-items:center;font-size:11px}
#event{height:32px;flex-shrink:0;background:#30251b;color:#ffd36b;text-align:center;font-size:12px;padding:8px}
canvas{width:100%;height:0;flex:1;background:#405c43}
#info{height:23px;flex-shrink:0;text-align:center;color:#ffd65b;font-size:12px;background:#172019;padding:4px}
#controls{height:140px;flex-shrink:0;background:#172019;display:flex;justify-content:space-around;align-items:center;padding:4px;gap:3px}
button{background:#344b3a;color:white;border:2px solid #829c84;border-radius:10px;padding:7px;font-size:14px;min-width:39px;height:45px}
.pad{display:grid;grid-template-columns:repeat(3,39px);grid-template-rows:repeat(2,45px);gap:2px}
.actions{display:grid;grid-template-columns:repeat(2,65px);gap:4px}
#fire{background:#a12e2e}
#panel{position:absolute;display:none;top:85px;left:8%;width:84%;background:#17251b;border:2px solid #b69b55;border-radius:12px;padding:12px;z-index:5;font-size:14px}
#panel button{margin:4px}
</style>
</head>
<body>
<div id="top">
<span>❤️ <b id="hp">100</b></span>
<span>🛡️ <b id="armor">1</b></span>
<span>🔫 <b id="ammo">60</b></span>
<span>💰 <b id="cash">0</b></span>
</div>
<div id="event">Загрузка событий...</div>
<canvas id="game"></canvas>
<div id="info">METRO ROYALE X 3.0 — ВЫЖИВИ И ЭВАКУИРУЙСЯ</div>
<div id="controls">
<div class="pad">
<span></span><button id="up">▲</button><span></span>
<button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
</div>
<div class="actions">
<button id="fire">ОГОНЬ</button>
<button id="loot">ЛУТ</button>
<button id="inv">🎒 ИНВЕНТАРЬ</button>
<button id="extract">ЭВАКУАЦИЯ</button>
</div>
</div>
<div id="panel"></div>
<script>
const cv=document.getElementById("game"),ctx=cv.getContext("2d");
let W,H;
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
resize();addEventListener("resize",resize);
const p={x:0,y:0,hp:100,armor:100,level:1,ammo:60,cash:0,kills:0,loot:0};
let keys={},enemies=[],crates=[],bullets=[],over=false;
let weapon="AKM",eventIndex=0,eventTime=60,eventDrop=null,eventName="";
let extract={x:700,y:500};
let hazard={x:-500,y:300,r:240};
let inventory=["AKM","60 патронов","Броня 1 уровня"];
const events=[
"📦 СОБЫТИЕ: ВОЗДУШНЫЙ ГРУЗ",
"🎯 СОБЫТИЕ: ОХОТА НА БОТОВ",
"💎 СОБЫТИЕ: РЕДКИЙ ЛУТ",
"☢️ СОБЫТИЕ: ОПАСНАЯ ЗОНА"
];
const colors=["#b4b4b4","#48b95b","#348ee8","#a34ee0","#e5a52d","#e43c36"];
function say(t){document.getElementById("info").textContent=t}
function ui(){
hp.textContent=Math.max(0,Math.floor(p.hp));
armor.textContent=p.level+" ур. / "+Math.floor(p.armor)+"%";
ammo.textContent=p.ammo;cash.textContent=p.cash;
}
function spawnEnemy(){
let a=Math.random()*Math.PI*2,d=350+Math.random()*500;
enemies.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,hp:100,cool:0});
}
function spawnCrate(x,y,type="Обычный"){
crates.push({x,y,type});
}
for(let i=0;i<9;i++)spawnEnemy();
for(let i=0;i<15;i++)spawnCrate(Math.random()*1200-600,Math.random()*1200-600);
function bind(id,k){
let b=document.getElementById(id);
b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[k]=false;
}
["up","down","left","right"].forEach(k=>bind(k,k));
function nextEvent(){
eventIndex=(eventIndex+1)%events.length;
eventTime=60;
eventName=events[eventIndex];
if(eventIndex===0){
eventDrop={x:p.x+Math.random()*500-250,y:p.y+Math.random()*500-250};
spawnCrate(eventDrop.x,eventDrop.y,"ВОЗДУШНЫЙ ГРУЗ");
say("ГРУЗ УЖЕ НА КАРТЕ! ИЩИ ЖЁЛТУЮ МЕТКУ");
}
if(eventIndex===1){for(let i=0;i<5;i++)spawnEnemy();say("НАЧАЛАСЬ ОХОТА НА БОТОВ!")}
if(eventIndex===2){
spawnCrate(p.x+250,p.y-200,"РЕДКИЙ ЛУТ");
say("РЕДКИЙ ЛУТ ПОЯВИЛСЯ НА КАРТЕ!");
}
if(eventIndex===3){
hazard={x:p.x+200,y:p.y+100,r:210};
say("ОПАСНАЯ ЗОНА! УХОДИ ОТ НЕЁ!");
}
document.getElementById("event").textContent=eventName+" — 60 сек.";
}
function shoot(){
if(over||p.ammo<=0)return;
p.ammo--;
if(enemies.length){
let e=enemies.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b);
let d=Math.hypot(e.x-p.x,e.y-p.y)||1;
if(d<450)bullets.push({x:p.x,y:p.y,vx:(e.x-p.x)/d*12,vy:(e.y-p.y)/d*12});
else say("ВРАГ СЛИШКОМ ДАЛЕКО");
}
ui();
}
fire.onpointerdown=shoot;
loot.onclick=()=>{
let i=crates.findIndex(c=>Math.hypot(c.x-p.x,c.y-p.y)<65);
if(i<0){say("ПОДОЙДИ БЛИЖЕ К ЯЩИКУ");return}
let c=crates.splice(i,1)[0];
let rare=c.type==="РЕДКИЙ ЛУТ"||c.type==="ВОЗДУШНЫЙ ГРУЗ";
p.cash+=rare?500:100;
p.ammo+=rare?60:20;
p.hp=Math.min(100,p.hp+15);
p.loot++;
if(p.level<6&&rare)p.level++;
p.armor=100;
inventory.push(c.type+" — добыча");
spawnCrate(p.x+Math.random()*500-250,p.y+Math.random()*500-250);
ui();say("ДОБЫЧА ПОЛУЧЕНА! "+c.type);
};
inv.onclick=()=>{
panel.style.display=panel.style.display==="block"?"none":"block";
panel.innerHTML="<b>🎒 ИНВЕНТАРЬ</b><br><br>Оружие: "+weapon+"<br>Броня: уровень "+p.level+"<br>Патроны: "+p.ammo+"<br>Добыча: "+p.loot+" предметов<br>Деньги: "+p.cash+"<br><br>"+inventory.slice(-8).join("<br>")+"<br><br><button onclick='panel.style.display=\"none\"'>ЗАКРЫТЬ</button>";
};
extract.onclick=()=>{
let d=Math.hypot(p.x-extract.x,p.y-extract.y);
if(d<75){
say("ЭВАКУАЦИЯ УСПЕШНА! НАГРАДА: "+(p.cash+500)+" МОНЕТ");
p.cash+=500;p.loot=0;inventory=[];p.x=0;p.y=0;
extract={x:700+Math.random()*500,y:500+Math.random()*500};
ui();
}else say("ДО ЭВАКУАЦИИ ЕЩЁ "+Math.floor(d)+" МЕТРОВ");
};
function building(x,y){
ctx.fillStyle="#55594b";ctx.fillRect(x,y,110,85);
ctx.fillStyle="#343a32";ctx.fillRect(x+12,y+12,27,20);
ctx.fillRect(x+65,y+12,27,20);
ctx.fillStyle="#81765c";ctx.fillRect(x+43,y+52,24,33);
}
function draw(){
ctx.fillStyle="#405c43";ctx.fillRect(0,0,W,H);
let cx=p.x-W/2,cy=p.y-H/2;
ctx.save();ctx.translate(-cx,-cy);
ctx.strokeStyle="#4c684e";
let sx=Math.floor(cx/50)*50,sy=Math.floor(cy/50)*50;
for(let x=sx;x<cx+W+50;x+=50){ctx.beginPath();ctx.moveTo(x,cy);ctx.lineTo(x,cy+H);ctx.stroke()}
for(let y=sy;y<cy+H+50;y+=50){ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx+W,y);ctx.stroke()}
for(let x=Math.floor(cx/400)*400-400;x<cx+W+400;x+=400)
for(let y=Math.floor(cy/400)*400-400;y<cy+H+400;y+=400){
building(x+60,y+80);building(x+220,y+220);
}
ctx.strokeStyle="#b7a36b";ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(cx-100,Math.floor(p.y/400)*400+40);ctx.lineTo(cx+W+100,Math.floor(p.y/400)*400+40);ctx.stroke();
ctx.fillStyle="rgba(170,50,40,.15)";ctx.beginPath();ctx.arc(hazard.x,hazard.y,hazard.r,0,7);ctx.fill();
ctx.strokeStyle="#e55";ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle="#57d7e8";ctx.beginPath();ctx.arc(extract.x,extract.y,28,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.fillText("ВЫХОД",extract.x-22,extract.y-38);
crates.forEach(c=>{
ctx.fillStyle=c.type==="ВОЗДУШНЫЙ ГРУЗ"?"#ed4545":c.type==="РЕДКИЙ ЛУТ"?"#c34cff":"#e6b82e";
ctx.fillRect(c.x-13,c.y-13,26,26);
});
bullets.forEach(b=>{ctx.fillStyle="#ffe65b";ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()});
enemies.forEach(e=>{
ctx.fillStyle="#d93636";ctx.beginPath();ctx.arc(e.x,e.y,14,0,7);ctx.fill();
ctx.fillStyle="#fff";ctx.fillRect(e.x-12,e.y-23,24*e.hp/100,4);
});
ctx.fillStyle=colors[p.level-1];ctx.beginPath();ctx.arc(p.x,p.y,19,0,7);ctx.fill();
ctx.fillStyle="#253d4a";ctx.fillRect(p.x-10,p.y-12,20,24);
ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.strokeRect(p.x-10,p.y-12,20,24);
ctx.restore();
let mx=W-85,my=65;
ctx.fillStyle="#15251c";ctx.fillRect(mx,my,75,75);
ctx.fillStyle="#54d6ff";ctx.fillRect(mx+35,my+35,5,5);
ctx.fillStyle="#e44";enemies.forEach(e=>{
let x=mx+37+(e.x-p.x)/25,y=my+37+(e.y-p.y)/25;
if(x>mx&&x<mx+75&&y>my&&y<my+75)ctx.fillRect(x,y,3,3);
});
ctx.strokeStyle="#fff";ctx.strokeRect(mx,my,75,75);
}
let last=Date.now();
function loop(){
let now=Date.now(),dt=Math.min((now-last)/1000,.05);last=now;
if(!over){
eventTime-=dt;
if(eventTime<=0)nextEvent();
document.getElementById("event").textContent=(eventName||"🎯 СОБЫТИЯ")+" — "+Math.ceil(eventTime)+" сек.";
let s=190*dt;
if(keys.up)p.y-=s;if(keys.down)p.y+=s;if(keys.left)p.x-=s;if(keys.right)p.x+=s;
enemies.forEach(e=>{
let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
if(d>30){e.x+=dx/d*35*dt;e.y+=dy/d*35*dt}
if(d<35&&++e.cool>35){
p.armor=Math.max(0,p.armor-5);
if(p.armor===0)p.hp-=5;
e.cool=0;ui();
}
});
bullets.forEach((b,i)=>{
b.x+=b.vx;b.y+=b.vy;
let j=enemies.findIndex(e=>Math.hypot(e.x-b.x,e.y-b.y)<18);
if(j>=0){enemies[j].hp-=50;bullets.splice(i,1)}
else if(Math.hypot(b.x-p.x,b.y-p.y)>600)bullets.splice(i,1);
});
enemies=enemies.filter(e=>{
if(e.hp<=0){p.kills++;spawnEnemy();return false}return true
});
if(Math.hypot(p.x-hazard.x,p.y-hazard.y)<hazard.r){p.hp-=3*dt;ui()}
if(p.hp<=0){p.hp=0;over=true;say("ТЫ ВЫБЫЛ! ОБНОВИ СТРАНИЦУ");ui()}
}
draw();requestAnimationFrame(loop);
}
nextEvent();ui();loop();
</script>
</body>
</html>
