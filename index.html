<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>METRO ROYALE X 4.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d12;color:#fff;font-family:Arial;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;background:#18231d}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.panel{background:#101a20dd;border:1px solid #53656a;border-radius:9px;padding:7px;font-size:12px}
#stats{line-height:1.6}
#event{color:#ffd166;font-weight:bold}
#map{width:100px;height:100px;border:1px solid #9aa;background:#101820}
#bottom{position:absolute;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#joy{width:112px;height:112px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff66;pointer-events:auto;position:relative}
#stick{position:absolute;width:42px;height:42px;border-radius:50%;background:#d9e5eaaa;left:33px;top:33px}
#actions{display:grid;grid-template-columns:repeat(2,76px);gap:8px;pointer-events:auto}
button{background:#182a32ed;color:white;border:1px solid #8ca1a9;border-radius:10px;padding:13px 5px;font-weight:bold;font-size:12px}
button:active{background:#55717b}
#fire{background:#8d2929ed}
#inventory{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(310px,90vw);background:#101a20f5;border:1px solid #9baeb4;border-radius:14px;padding:15px;display:none;z-index:5}
#inventory button{width:100%;margin-top:8px}
#message{position:absolute;top:125px;left:50%;transform:translateX(-50%);background:#101a20dd;padding:8px 13px;border-radius:8px;color:#ffe08a;font-size:13px;text-align:center;pointer-events:none}
#title{font-weight:bold;color:#c5d5db}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="panel" id="stats">
  <div id="title">METRO ROYALE X 4.0</div>
  ❤️ <span id="hp">100</span>　🛡️ <span id="armor">1</span><br>
  🔫 <span id="weapon">Пистолет</span>　<span id="ammo">12/12</span><br>
  💰 <span id="cash">0</span>　💀 <span id="kills">0</span><br>
  <span id="event">Исследуй карту</span>
 </div>
 <canvas id="map" width="100" height="100"></canvas>
</div>
<div id="message">Найди лут и доберись до выхода!</div>
<div id="bottom">
 <div id="joy"><div id="stick"></div></div>
 <div id="actions">
  <button id="fire">ОГОНЬ</button>
  <button id="reload">ПЕРЕЗАРЯДКА</button>
  <button id="switch">СМЕНИТЬ ОРУЖИЕ</button>
  <button id="heal">АПТЕЧКА</button>
  <button id="bag">ИНВЕНТАРЬ</button>
  <button id="exit">ВЫХОД</button>
 </div>
</div>
<div id="inventory">
 <h3>🎒 ИНВЕНТАРЬ</h3>
 <p id="bagtext"></p>
 <button onclick="closeBag()">ЗАКРЫТЬ</button>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const mini=document.getElementById('map'),mx=mini.getContext('2d');
let W=2200,H=1700,cam={x:0,y:0};
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
const player={x:300,y:300,hp:100,armor:1,cash:0,kills:0,med:2,ammo:12,maxAmmo:12,weapon:0,angle:0,speed:190};
const weapons=[
 {name:'Пистолет',mag:12,damage:24,rate:330,range:430},
 {name:'Автомат',mag:30,damage:15,rate:115,range:540},
 {name:'Тяжёлый',mag:8,damage:38,rate:520,range:650}
];
let bots=[],loot=[],bullets=[],effects=[],buildings=[],keys={},joy={x:0,y:0},firing=false;
let lastShot=0,lastTime=0,eventTime=0,eventName='Тихая зона',eventMsg='Исследуй карту';
let exitPoint={x:1950,y:1400},gameOver=false,won=false,inventoryOpen=false;
const rand=(a,b)=>a+Math.random()*(b-a);
function message(t){let el=document.getElementById('message');el.textContent=t;el.style.display='block';clearTimeout(message.timer);message.timer=setTimeout(()=>el.style.display='none',2200)}
for(let i=0;i<48;i++){
 let x=rand(100,W-180),y=rand(100,H-150);
 buildings.push({x,y,w:rand(75,160),h:rand(65,135)});
}
function spawnBot(){
 let a=rand(0,Math.PI*2),d=rand(420,850);
 bots.push({x:Math.max(40,Math.min(W-40,player.x+Math.cos(a)*d)),y:Math.max(40,Math.min(H-40,player.y+Math.sin(a)*d)),hp:60,max:60,speed:rand(55,85),cool:rand(0,2),wander:rand(0,6)});
}
function spawnLoot(x,y,type){
 loot.push({x,y,type,used:false});
}
for(let i=0;i<35;i++){
 let x=rand(80,W-80),y=rand(80,H-80);
 spawnLoot(x,y,Math.random()<.18?'rare':'box');
}
for(let i=0;i<9;i++)spawnBot();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){
 if(gameOver||won)return;
 eventTime+=dt;
 if(eventTime>45){
  eventTime=0;
  let events=['АИРДРОП: редкий лут','ОХОТА НА БОТОВ','ЗОНА ОПАСНОСТИ','ТИХАЯ ЗОНА'];
  eventName=events[Math.floor(Math.random()*events.length)];
  eventMsg=eventName;document.getElementById('event').textContent=eventName;
  if(eventName.startsWith('АИРДРОП'))spawnLoot(rand(150,W-150),rand(150,H-150),'air');
  if(eventName.startsWith('ОХОТА'))for(let i=0;i<3;i++)spawnBot();
  message(eventName);
 }
 let dx=(keys['ArrowRight']||keys['d']?1:0)-(keys['ArrowLeft']||keys['a']?1:0)+joy.x;
 let dy=(keys['ArrowDown']||keys['s']?1:0)-(keys['ArrowUp']||keys['w']?1:0)+joy.y;
 let len=Math.hypot(dx,dy);
 if(len>1){dx/=len;dy/=len}
 player.x=clamp(player.x+dx*player.speed*dt,20,W-20);
 player.y=clamp(player.y+dy*player.speed*dt,20,H-20);
 if(dx||dy)player.angle=Math.atan2(dy,dx);
 cam.x=clamp(player.x-innerWidth/2,0,W-innerWidth);
 cam.y=clamp(player.y-innerHeight/2,0,H-innerHeight);
 for(let b of bots){
  let d=dist(player,b);
  if(d<650){
   let a=Math.atan2(player.y-b.y,player.x-b.x);
   b.x+=Math.cos(a)*b.speed*dt;b.y+=Math.sin(a)*b.speed*dt;
   b.cool-=dt;
   if(d<300&&b.cool<=0){
    b.cool=1.5;
    let hit=Math.random()<.38;
    if(hit){
     let damage=8;
     if(player.armor>1)damage*=.65;
     player.hp=Math.max(0,player.hp-damage);
     if(player.hp<=0){gameOver=true;message('ТЫ ПОТЕРПЕЛ ПОРАЖЕНИЕ');}
    }
   }
  }else{b.wander-=dt;if(b.wander<=0){b.wander=3;b.wx=rand(-1,1);b.wy=rand(-1,1)}b.x+= (b.wx||0)*b.speed*.3*dt;b.y+=(b.wy||0)*b.speed*.3*dt}
 }
 for(let q of bullets){
  q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
  for(let b of bots)if(b.hp>0&&Math.hypot(q.x-b.x,q.y-b.y)<19){b.hp-=q.damage;q.life=0;if(b.hp<=0){player.kills++;player.cash+=120;spawnLoot(b.x,b.y,Math.random()<.25?'rare':'box')}break}
 }
 bullets=bullets.filter(q=>q.life>0);
 for(let e of effects)e.life-=dt;effects=effects.filter(e=>e.life>0);
 if(firing)shoot();
 for(let l of loot)if(!l.used&&dist(player,l)<35){
  l.used=true;
  if(l.type==='rare'){player.armor=Math.min(6,player.armor+1);player.cash+=500;player.med++;message('РЕДКИЙ ЛУТ! Броня улучшена!')}
  else if(l.type==='air'){player.cash+=900;player.ammo+=weapons[player.weapon].mag;player.med++;player.armor=Math.min(6,player.armor+1);message('АИРДРОП СОБРАН!')}
  else{let r=Math.random();if(r<.35){player.cash+=rand(80,220)|0;message('Найдены деньги')}else if(r<.65){player.ammo+=weapons[player.weapon].mag;message('Найдены патроны')}else{player.med++;message('Найдена аптечка')}}
 }
 if(dist(player,exitPoint)<65){won=true;player.cash+=1000;message('ЭВАКУАЦИЯ УСПЕШНА! +1000');}
 updateHud();
}
function shoot(){
 let w=weapons[player.weapon],now=performance.now();
 if(now-lastShot<w.rate||player.ammo<=0)return;
 lastShot=now;player.ammo--;
 let target=null,bd=w.range;
 for(let b of bots){let d=dist(player,b);if(b.hp>0&&d<bd){bd=d;target=b}}
 let a=target?Math.atan2(target.y-player.y,target.x-player.x):player.angle;
 a+=rand(-.07,.07);
 bullets.push({x:player.x+Math.cos(a)*18,y:player.y+Math.sin(a)*18,vx:Math.cos(a)*650,vy:Math.sin(a)*650,life:.7,damage:w.damage});
 effects.push({x:player.x,y:player.y,life:.08});
}
function reload(){let w=weapons[player.weapon];let need=w.mag-player.ammo;if(need<=0)return;let n=Math.min(need,player.ammoReserve||0);if(n===0){message('Нет запаса патронов');return}player.ammo+=n;player.ammoReserve-=n;message('Перезарядка завершена')}
player.ammoReserve=90;
function heal(){if(player.med<=0){message('Нет аптечек');return}if(player.hp>=100){message('Здоровье уже полное');return}player.med--;player.hp=Math.min(100,player.hp+45);message('Аптечка использована')}
function switchWeapon(){player.weapon=(player.weapon+1)%weapons.length;player.ammo=weapons[player.weapon].mag;player.ammoReserve+=12;message('Оружие: '+weapons[player.weapon].name)}
function updateHud(){
 document.getElementById('hp').textContent=Math.ceil(player.hp);
 document.getElementById('armor').textContent=player.armor;
 document.getElementById('weapon').textContent=weapons[player.weapon].name;
 document.getElementById('ammo').textContent=player.ammo+'/'+player.ammoReserve;
 document.getElementById('cash').textContent=player.cash;
 document.getElementById('kills').textContent=player.kills;
}
function draw(){
 let vw=innerWidth,vh=innerHeight;
 ctx.clearRect(0,0,vw,vh);ctx.save();ctx.translate(-cam.x,-cam.y);
 ctx.fillStyle='#26352b';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#344238';ctx.lineWidth=1;
 for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.fillStyle='#343b3b';ctx.fillRect(0,780,W,85);ctx.fillRect(850,0,75,H);
 for(let b of buildings){ctx.fillStyle='#555b55';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#747d75';ctx.fillRect(b.x+7,b.y+7,b.w-14,b.h-14);ctx.fillStyle='#303a35';ctx.fillRect(b.x+b.w/2-9,b.y+b.h/2-9,18,18)}
 for(let l of loot)if(!l.used){ctx.fillStyle=l.type==='air'?'#e3c64d':l.type==='rare'?'#a855f7':'#c58a43';ctx.fillRect(l.x-10,l.y-10,20,20);ctx.strokeStyle='#fff';ctx.strokeRect(l.x-10,l.y-10,20,20)}
 ctx.fillStyle='#31d17c';ctx.beginPath();ctx.arc(exitPoint.x,exitPoint.y,24,0,7);ctx.fill();ctx.fillStyle='#10251a';ctx.fillText('ВЫХОД',exitPoint.x-20,exitPoint.y+4);
 for(let b of bots)if(b.hp>0){ctx.fillStyle='#d34c4c';ctx.beginPath();ctx.arc(b.x,b.y,16,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(b.x-16,b.y-25,32,4);ctx.fillStyle='#72df73';ctx.fillRect(b.x-16,b.y-25,32*b.hp/b.max,4)}
 for(let q of bullets){ctx.fillStyle='#ffe18a';ctx.beginPath();ctx.arc(q.x,q.y,4,0,7);ctx.fill()}
 ctx.fillStyle=player.armor>=5?'#f0d36a':player.armor>=3?'#b5b9c2':'#53a8e8';
 ctx.beginPath();ctx.arc(player.x,player.y,18,0,7);ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+Math.cos(player.angle)*29,player.y+Math.sin(player.angle)*29);ctx.stroke();
 ctx.restore();
 mx.clearRect(0,0,100,100);mx.fillStyle='#26352b';mx.fillRect(0,0,100,100);
 mx.fillStyle='#31d17c';mx.fillRect(exitPoint.x/W*100-2,exitPoint.y/H*100-2,4,4);
 mx.fillStyle='#d34c4c';for(let b of bots)if(b.hp>0)mx.fillRect(b.x/W*100-1,b.y/H*100-1,3,3);
 mx.fillStyle='#53a8e8';mx.beginPath();mx.arc(player.x/W*100,player.y/H*100,3,0,7);mx.fill();
 if(gameOver||won){ctx.fillStyle='#000a';ctx.fillRect(0,0,vw,vh);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px Arial';ctx.fillText(won?'ЭВАКУАЦИЯ УСПЕШНА':'ИГРА ОКОНЧЕНА',vw/2,vh/2);ctx.font='16px Arial';ctx.fillText('Обнови страницу для новой игры',vw/2,vh/2+35);ctx.textAlign='left'}
}
function loop(t){let dt=Math.min(.04,(t-lastTime)/1000||0);lastTime=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='r')reload();if(e.key===' ')firing=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')firing=false});
document.getElementById('fire').onpointerdown=e=>{firing=true;e.currentTarget.setPointerCapture(e.pointerId)};
document.getElementById('fire').onpointerup=()=>firing=false;
document.getElementById('fire').onpointercancel=()=>firing=false;
document.getElementById('reload').onclick=reload;
document.getElementById('switch').onclick=switchWeapon;
document.getElementById('heal').onclick=heal;
document.getElementById('bag').onclick=()=>{
 inventoryOpen=!inventoryOpen;
 document.getElementById('inventory').style.display=inventoryOpen?'block':'none';
 document.getElementById('bagtext').textContent='Аптечки: '+player.med+' | Деньги: '+player.cash+' | Броня: '+player.armor+'/6 | Патроны: '+player.ammoReserve;
};
function closeBag(){inventoryOpen=false;document.getElementById('inventory').style.display='none'}
document.getElementById('exit').onclick=()=>{let d=dist(player,exitPoint);message('До выхода: '+Math.round(d)+' м')};
let joyEl=document.getElementById('joy'),stick=document.getElementById('stick'),joyId=null;
joyEl.onpointerdown=e=>{joyId=e.pointerId;joyEl.setPointerCapture(joyId);moveJoy(e)};
joyEl.onpointermove=e=>{if(e.pointerId===joyId)moveJoy(e)};
function moveJoy(e){let r=joyEl.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),m=35;if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;stick.style.left=(35+x)+'px';stick.style.top=(35+y)+'px'}
function stopJoy(){joyId=null;joy.x=joy.y=0;stick.style.left='33px';stick.style.top='33px'}
joyEl.onpointerup=stopJoy;joyEl.onpointercancel=stopJoy;
</script>
</body>
</html>
